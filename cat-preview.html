<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🐱 养猫预览</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    background: linear-gradient(180deg, #fdfbf7 0%, #f4f9f9 100%);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }
  .card {
    background: #fff;
    border-radius: 24px;
    padding: 24px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.08);
    width: 100%;
    max-width: 400px;
    text-align: center;
    position: relative;
  }
  /* 猫咪场景容器：背景 + 猫 */
  .cat-scene {
    position: relative;
    width: 100%;
    height: 340px;
    margin-bottom: 20px;
    border-radius: 20px;
    overflow: hidden;
    /* 背景：柔和的天空渐变 + 太阳光晕 */
    background:
      radial-gradient(circle at 75% 20%, rgba(255, 220, 150, 0.7), rgba(255, 220, 150, 0) 40%),
      radial-gradient(circle at 20% 80%, rgba(200, 230, 255, 0.5), rgba(200, 230, 255, 0) 50%),
      linear-gradient(180deg, #e8f4ff 0%, #fef9ef 60%, #fff5e6 100%);
  }
  /* 背景上的云朵（纯 CSS，不动） */
  .cloud {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    opacity: 0.75;
    filter: blur(2px);
    z-index: 0;
  }
  .cloud1 { width: 80px; height: 40px; top: 20px; left: 10%; }
  .cloud2 { width: 60px; height: 30px; top: 50px; right: 15%; opacity: 0.6; }
  .cloud3 { width: 100px; height: 50px; bottom: 80px; left: 5%; opacity: 0.5; }

  /* 地面线条 */
  .floor {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 60px;
    background: linear-gradient(180deg, rgba(200, 220, 180, 0.4), rgba(180, 210, 160, 0.6));
    z-index: 0;
  }

  /* 猫下方的落地阴影 */
  .cat-wrap {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }
  .cat-wrap::after {
    content: '';
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: 35%;
    height: 12px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.2), rgba(0,0,0,0) 70%);
    border-radius: 50%;
    animation: shadowBreath 3s ease-in-out infinite;
    z-index: 0;
  }
  @keyframes shadowBreath {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 0.25; }
  }
  .cat-img {
    position: relative;
    max-width: 65%;
    max-height: 65%;
    object-fit: contain;
    z-index: 1;
    transition: transform 0.3s ease;
    animation: float3D 4s ease-in-out infinite;
    filter: drop-shadow(0 10px 18px rgba(0,0,0,0.18));
    cursor: pointer;
    will-change: transform;
  }
  @keyframes float3D {
    0%, 100% {
      transform: translateY(0) scale(1);
    }
    50% {
      transform: translateY(-10px) scale(1.03);
    }
  }
  .cat-img:active {
    transform: scale(0.96) translateY(2px);
    transition: transform 0.1s;
  }
  .cat-img.bounce {
    animation: bounce 0.6s ease;
  }
  .cat-img.shake {
    animation: shake 0.5s ease;
  }
  @keyframes bounce {
    0%, 100% { transform: scale(1) translateY(0); }
    50% { transform: scale(1.12) translateY(-15px); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  .cat-title {
    font-size: 20px;
    font-weight: bold;
    color: #4b7f23;
    margin: 10px 0;
  }
  .agent-bubble {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: #fff;
    border: 2px solid #fde68a;
    border-radius: 20px;
    padding: 12px 16px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    max-width: 200px;
    font-size: 14px;
    color: #92400e;
    font-weight: bold;
    animation: popIn 0.3s ease;
    z-index: 100;
  }
  .agent-bubble::after {
    content: '';
    position: absolute;
    bottom: -8px;
    right: 20px;
    width: 0;
    height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 8px solid #fff;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 20px;
  }
  .btn {
    padding: 10px 16px;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .btn:active { transform: scale(0.95); }
  .btn-normal { background: #e5e7eb; color: #333; }
  .btn-hungry { background: #fee2e2; color: #b91c1c; }
  .btn-cold { background: #dbeafe; color: #1d4ed8; }
  .btn-fed { background: #dcfce7; color: #15803d; }
  .btn-warm { background: #fffbeb; color: #92400e; }
</style>
</head>
<body>

<div class="card">
  <div class="cat-title">我的猫「小橘」· 阶段 1</div>

  <!-- 猫的场景容器：背景 + 云 + 猫 -->
  <div class="cat-scene">
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>
    <div class="floor"></div>
    <div class="cat-wrap">
      <img id="catImg" class="cat-img" src="cat-stage-1-normal.png" alt="猫咪">
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-normal" onclick="setCatState('normal')">😴 正常休息</button>
    <button class="btn btn-hungry" onclick="setCatState('hungry')">🍼 饿了找奶</button>
    <button class="btn btn-cold" onclick="setCatState('cold')">🧣 冷了要毯子</button>
    <button class="btn btn-fed" onclick="setCatState('fed')">🍖 喂奶成功</button>
    <button class="btn btn-warm" onclick="setCatState('warm')">☀️ 盖毯子保暖</button>
  </div>
</div>

<div id="agentBubble" class="agent-bubble">喵～小橘在睡觉呢～</div>

<script>
  const catImg = document.getElementById('catImg');
  const agentBubble = document.getElementById('agentBubble');

  const catStates = {
    normal: {
      img: 'cat-stage-1-normal.png',
      text: '喵～小橘在睡觉呢～',
      anim: 'breathe'
    },
    hungry: {
      img: 'cat-stage-1-hungry.png',
      text: '喵～我饿了，想喝奶🍼',
      anim: 'shake'
    },
    cold: {
      img: 'cat-stage-1-cold.png',
      text: '喵～我冷了，要小毯子🧣',
      anim: 'shake'
    },
    fed: {
      img: 'cat-stage-1-fed.png',
      text: '咕嘟咕嘟～好喝！',
      anim: 'bounce'
    },
    warm: {
      img: 'cat-stage-1-warm.png',
      text: '暖暖的，好舒服～',
      anim: 'bounce'
    }
  };

  const preloadedImages = {};
  function preloadAllImages() {
    Object.keys(catStates).forEach(key => {
      const img = new Image();
      img.src = catStates[key].img;
      preloadedImages[key] = img;
    });
  }
  preloadAllImages();

  function setCatState(state) {
    const config = catStates[state];
    if (!config) return;

    catImg.src = config.img;

    catImg.classList.remove('bounce', 'shake');
    void catImg.offsetWidth;
    catImg.classList.add(config.anim);

    agentBubble.innerText = config.text;
    agentBubble.style.animation = 'none';
    void agentBubble.offsetWidth;
    agentBubble.style.animation = 'popIn 0.3s ease';

    if (state === 'fed' || state === 'warm') {
      clearTimeout(window.autoResetTimer);
      window.autoResetTimer = setTimeout(() => {
        setCatState('normal');
      }, 3000);
    }
  }
</script>

</body>
</html>
