<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🐱 养猫预览</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    background: linear-gradient(180deg, #fdfbf7 0%, #f4f9f9 100%);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }
  .card {
    background: #fff;
    border-radius: 24px;
    padding: 24px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.08);
    width: 100%;
    max-width: 400px;
    text-align: center;
  }
  .cat-title {
    font-size: 20px;
    font-weight: bold;
    color: #4b7f23;
    margin: 10px 0;
  }
  .cat-scene {
    position: relative;
    width: 100%;
    height: 380px;
    margin-bottom: 16px;
    border-radius: 20px;
    overflow: hidden;
    background: #f0f0f0; /* 视频自带背景，这里用灰色垫底 */
  }
  .cat-media {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100%;
    height: 100%;
    object-fit: contain; /* 保持比例，不拉伸 */
    transition: opacity 0.3s ease;
    z-index: 2;
  }
  .cat-media.hidden { display: none; }

  /* 气泡：移到右上方 */
  .agent-bubble {
    position: fixed;
    top: 30px;
    right: 30px;
    background: #fff;
    border: 2px solid #fde68a;
    border-radius: 20px;
    padding: 12px 16px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    max-width: 200px;
    font-size: 14px;
    color: #92400e;
    font-weight: bold;
    animation: popIn 0.3s ease;
    z-index: 100;
  }
  .agent-bubble::after {
    content: '';
    position: absolute;
    bottom: -8px;
    right: 20px;
    width: 0; height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 8px solid #fff;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }

  /* 控制按钮 */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin-top: 12px;
  }
  .btn {
    padding: 10px 14px;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .btn:active { transform: scale(0.95); }
  .btn-normal { background: #e5e7eb; color: #333; }
  .btn-drink { background: #dcfce7; color: #15803d; }
  .btn-play { background: #fef3c7; color: #92400e; }
  .btn-blanket { background: #fffbeb; color: #92400e; }
</style>
</head>
<body>

<div class="card">
  <div class="cat-title">我的猫「小橘」</div>

  <div class="cat-scene" id="catScene">
    <!-- 正常休息（视频，循环） -->
    <video id="vidNormal" class="cat-media" autoplay muted loop playsinline>
      <source src="cat-normal.mp4" type="video/mp4">
    </video>
    <!-- 喝奶（视频，不循环，播完结束） -->
    <video id="vidDrink" class="cat-media hidden" autoplay muted playsinline>
      <source src="cat-drink.mp4" type="video/mp4">
    </video>
    <!-- 玩球（视频，不循环，播完结束） -->
    <video id="vidPlay" class="cat-media hidden" autoplay muted playsinline>
      <source src="cat-play.mp4" type="video/mp4">
    </video>
    <!-- 裹毯子（视频，不循环，播完结束） -->
    <video id="vidBlanket" class="cat-media hidden" autoplay muted playsinline>
      <source src="cat-blanket.mp4" type="video/mp4">
    </video>
  </div>

  <div class="controls">
    <button class="btn btn-normal" onclick="setCatState('normal')">😴 正常</button>
    <button class="btn btn-drink" onclick="setCatState('drink')">🥛 喝奶</button>
    <button class="btn btn-play" onclick="setCatState('play')">🎾 玩球</button>
    <button class="btn btn-blanket" onclick="setCatState('blanket')">🛌 裹毯子</button>
  </div>
</div>

<div id="agentBubble" class="agent-bubble">喵～小橘在睡觉呢～</div>

<script>
  const agentBubble = document.getElementById('agentBubble');
  
  // 只保留有视频的状态
  const mediaElements = {
    normal: document.getElementById('vidNormal'),
    drink: document.getElementById('vidDrink'),
    play: document.getElementById('vidPlay'),
    blanket: document.getElementById('vidBlanket')
  };

  const stateTexts = {
    normal: '喵～小橘在睡觉呢～',
    drink: '咕嘟咕嘟～好喝！',
    play: '喵呜～球球真好玩！',
    blanket: '暖暖的，好舒服～'
  };

  // 暂停所有视频并重置
  function pauseAllVideos() {
    Object.values(mediaElements).forEach(el => {
      if (el && el.tagName === 'VIDEO') {
        el.pause();
        el.currentTime = 0;
        el.onended = null;
      }
    });
  }

  // 切换状态
  function setCatState(state) {
    // 1. 隐藏所有
    Object.values(mediaElements).forEach(el => {
      if (el) el.classList.add('hidden');
    });

    // 2. 如果是切回 normal，暂停其他视频
    if (state === 'normal') {
      pauseAllVideos();
    }

    // 3. 显示对应的元素
    const target = mediaElements[state];
    if (target) {
      target.classList.remove('hidden');
      if (target.tagName === 'VIDEO') {
        target.onended = null;
        target.play().catch(e => console.log('视频播放失败:', e));
        // 临时状态：播完自动回正常
        if (state === 'drink' || state === 'play' || state === 'blanket') {
          target.onended = function() {
            setCatState('normal');
          };
        }
      }
    }

    // 4. 更新气泡
    if (stateTexts[state]) {
      agentBubble.innerText = stateTexts[state];
      agentBubble.style.animation = 'none';
      void agentBubble.offsetWidth;
      agentBubble.style.animation = 'popIn 0.3s ease';
    }
  }
</script>

</body>
</html>
